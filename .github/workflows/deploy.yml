# Builds the static export and deploys it to the test Cloudflare Worker on
# every push to main, which is what the editor's Publish (Save to GitHub) does.
# Requires two repository secrets: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit)
# and CLOUDFLARE_ACCOUNT_ID.
name: Deploy test site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-test
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The export rules live in the editor, so every site gets the same
      # output without keeping a build script of its own.
      - name: Fetch the editor's static exporter
        run: curl -fsSL https://editor.techies.tools/native-export.mjs -o /tmp/native-export.mjs
      - name: Build static export
        run: node /tmp/native-export.mjs --out dist
      # Stopgap until the exporter handles these itself: Cloudflare's
      # "404-page" handling serves a top-level 404.html, and site.json says
      # "indexable": false, so every response is marked noindex.
      - name: Add 404.html and noindex header
        run: |
          cp dist/404/index.html dist/404.html
          printf '/*\n  X-Robots-Tag: noindex\n' >> dist/_headers
      - name: Deploy to Cloudflare Workers
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
