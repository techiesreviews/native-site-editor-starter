# Deploys the site to the test Cloudflare Worker on every push to main, which
# is what the editor's Save to GitHub does. There is no build: the repository
# is the site, and .assetsignore keeps repository-only files off it.
# Requires two repository secrets: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit)
# and CLOUDFLARE_ACCOUNT_ID.
name: Deploy test site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-test
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy to Cloudflare Workers
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
