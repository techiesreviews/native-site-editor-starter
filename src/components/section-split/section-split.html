<section data-key="section-split">

    <slot name="image"><img src="src/images/studio-desk.svg" alt="" data-key="split-image"></slot>
  </div>
  <div class="content" data-key="split-content">
    <h2 data-key="split-title"><slot name="title">A short, clear headline.</slot></h2>

    <div class="actions" data-key="split-actions">

    </div>
  </div>
</section>
