<section data-key="section-split">
  <div class="media" data-key="split-media">
    <slot name="image" data-if><img src="src/images/studio-desk.svg" alt="" data-key="split-image"></slot>
  </div>
  <div class="content" data-key="split-content">
    <slot name="title" data-if><h2 data-key="split-title">A short, clear headline.</h2></slot>
    <slot name="lede" data-if><p data-key="split-lede">One or two sentences that say why this matters and what the reader gets.</p></slot>
    <div class="actions" data-key="split-actions">
      <slot name="primary" data-if><a href="#/about/#contact" data-key="split-primary">Get in touch</a></slot>
      <slot name="secondary" data-if><a href="#/" data-key="split-secondary">See our work</a></slot>
    </div>
  </div>
</section>
